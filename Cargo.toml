[package]
name = "filters"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A human-friendly filter expression language for matching your objects against user-provided queries."
authors = ["Sierra Softworks <admin@sierrasoftworks.com>"]
license = "MIT"
repository = "https://github.com/SierraSoftworks/filters"
homepage = "https://github.com/SierraSoftworks/filters"
documentation = "https://docs.rs/filters"
readme = "README.md"
keywords = ["filter", "expression", "dsl", "query", "matching"]
categories = ["parser-implementations"]
exclude = [".github/", "assets/"]

[dependencies]
human-errors = "0.2.3"
regex = { version = "1.11", optional = true }
secrecy = { version = "0.10", optional = true }
serde = { version = "1.0", optional = true }

[features]
default = []

## Enables the `matches` regular expression operator within filter expressions.
regex = ["dep:regex"]

## Enables storing secret strings (backed by [`secrecy::SecretString`]) in a [`FilterValue`],
## which behave like normal strings in comparisons but are always redacted when formatted.
secrecy = ["dep:secrecy"]

## Enables deserializing a [`Filter`] directly from configuration files using serde.
serde = ["dep:serde"]

# The allocation-counting test installs its own #[global_allocator] and needs
# to run single-threaded so that no other test's allocations pollute the
# measurements; disabling the default harness gives it a deterministic main().
[[test]]
name = "alloc"
harness = false

[dev-dependencies]
criterion = "0.8"
regex = "1.11"
rstest = "0.26.1"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "filtering"
harness = false
