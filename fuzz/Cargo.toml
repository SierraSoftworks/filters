[package]
name = "filt-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
default = ["fuzz-targets"]
fuzz-targets = []

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
filt-rs = { path = "..", features = ["chrono", "regex"] }
libfuzzer-sys = "0.4"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
required-features = ["fuzz-targets"]

[[bin]]
name = "evaluate"
path = "fuzz_targets/evaluate.rs"
test = false
doc = false
bench = false
required-features = ["fuzz-targets"]