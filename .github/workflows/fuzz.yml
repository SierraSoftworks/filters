name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    env:
      CARGO_FUZZ_VERSION: 0.13.2
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      FUZZ_TIME: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 300 || 60 }}
      RUSTFLAGS: -C target-feature=-crt-static
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse
          - evaluate

    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
          key: fuzz-${{ matrix.target }}

      - name: Cache cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-bin-${{ env.CARGO_FUZZ_VERSION }}

      - name: Add cargo-fuzz to PATH
        shell: bash
        run: echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> "$GITHUB_PATH"

      - name: Install cargo-fuzz
        run: >-
          cargo install
          --root "${{ runner.tool_cache }}/cargo-fuzz"
          --version "${{ env.CARGO_FUZZ_VERSION }}"
          cargo-fuzz
          --locked

      - name: Build fuzz target
        run: >-
          cargo +nightly fuzz build
          --target x86_64-unknown-linux-gnu
          "${{ matrix.target }}"

      - name: Run fuzz target
        id: fuzz
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
            "${{ matrix.target }}" "fuzz/corpus/${{ matrix.target }}" -- \
            -max_total_time="${FUZZ_TIME}" -timeout=10 2>&1 | tee "fuzz-${{ matrix.target }}.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload failure details
        if: always() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-failure-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz-${{ matrix.target }}.log
            fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 30

      - name: Report fuzz failure
        if: >-
          always() &&
          steps.fuzz.outcome == 'failure' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v8
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_LOG: fuzz-${{ matrix.target }}.log
        with:
          script: |
            const fs = require('fs');
            const target = process.env.FUZZ_TARGET;
            const marker = `<!-- filt-rs-fuzz:${target} -->`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let log = fs.readFileSync(process.env.FUZZ_LOG, 'utf8');
            if (log.length > 50000) {
              log = `[truncated to final 50000 characters]\n${log.slice(-50000)}`;
            }
            log = log.replaceAll('```', '` ` `');

            const occurrence = [
              `Fuzz target: \`${target}\``,
              `Commit: \`${context.sha}\``,
              `Workflow run: ${runUrl}`,
              `Failure artifacts: ${runUrl}#artifacts`,
              '',
              '<details><summary>Fuzzer output</summary>',
              '',
              '```text',
              log,
              '```',
              '</details>',
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue =>
              !issue.pull_request && issue.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: occurrence,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Fuzz failure: ${target}`,
                body: `${marker}\nA fuzzing run found a reproducible failure.\n\n${occurrence}`,
              });
            }

      - name: Fail job after reporting
        if: always() && steps.fuzz.outcome == 'failure'
        run: exit 1